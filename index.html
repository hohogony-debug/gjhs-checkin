<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>5차 입학설명회 입장 확인</title>
<style>
@font-face{font-family:"Paperlogy";src:url("fonts/Paperlogy-7Bold.ttf") format("truetype");font-weight:700;font-display:swap}
@font-face{font-family:"Paperlogy";src:url("fonts/Paperlogy-9Black.ttf") format("truetype");font-weight:900;font-display:swap}
/* 광양제철고 화이트&블루: 화이트 + 블루 1C60EF + 라이트블루 DBE8FE, 강조 진한 블루 1247B8, 모든 글씨 굵게 */
:root{
  --white:#ffffff; --blue:#1C60EF; --blue-deep:#1247B8; --sky:#DBE8FE; --sky-line:#C3D9FC;
  --ink:#10192B; --gray:#5B6479;
  --ok:#1247B8; --ok-soft:#E6EEFF; --no:#B4501C; --no-soft:#FDF0E7;
  --body:"Paperlogy","Apple SD Gothic Neo","Malgun Gothic",sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--white)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);font-weight:700;font-size:16px;line-height:1.6;word-break:keep-all;
  background:
    radial-gradient(circle at 105% -5%, var(--sky) 0, rgba(219,232,254,0) 42%),
    radial-gradient(circle at -10% 105%, var(--sky) 0, rgba(219,232,254,0) 45%),
    linear-gradient(160deg, var(--white) 0%, #F3F7FF 55%, var(--sky) 100%);
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:18px;position:relative}
/* 상단 학교 띠 */
.band{margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:14px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(120deg,var(--blue-deep),var(--blue));color:var(--white);display:flex;align-items:center;gap:10px;
  border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(18,71,184,.18)}
.mark{width:34px;height:34px;border-radius:50%;background:var(--white);display:grid;place-items:center;flex:0 0 auto}
.mark i{width:18px;height:18px;border-radius:50%;border:4px solid var(--blue);display:block}
.band b{font-size:17px;font-weight:900;letter-spacing:.02em}
.band span{font-size:11px;opacity:.85;margin-left:auto;letter-spacing:.06em;white-space:nowrap}
@media (max-width:380px){.band span{display:none}}
.head{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.pill{align-self:flex-start;font-size:13px;font-weight:900;color:var(--blue-deep);background:var(--sky);border:1px solid var(--sky-line);padding:3px 12px;border-radius:999px}
h1{font-size:28px;font-weight:900;margin:0;line-height:1.3}
h1 em{font-style:normal;color:var(--blue)}
.sub{color:var(--gray);font-size:15px;margin:0}
.box{background:var(--white);border:2px solid var(--sky-line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 24px rgba(28,96,239,.08)}
label{font-weight:900;font-size:15px;color:var(--blue-deep)}
input{font:700 22px var(--body);padding:12px 14px;border:2px solid var(--sky-line);border-radius:12px;background:#F6F9FF;color:var(--ink);width:100%}
input:focus{outline:none;border-color:var(--blue)}
button{font:900 18px var(--body);padding:14px;border:0;border-radius:12px;background:var(--blue);color:var(--white);cursor:pointer}
button:active{background:var(--blue-deep)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.hint{font-size:13px;color:var(--gray);margin:0}
.who{font-size:22px;font-weight:900;text-align:center}
.reg{text-align:center;color:var(--gray);font-size:16px}
.step{display:flex;align-items:center;justify-content:center;gap:18px}
.step button{width:64px;height:64px;padding:0;font-size:32px;border-radius:50%;background:var(--sky);color:var(--blue-deep);border:2px solid var(--sky-line)}
.step output{font-size:60px;font-weight:900;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums;line-height:1;color:var(--blue-deep)}
.unit{font-size:20px;font-weight:900;margin-left:-10px}
.pick{display:flex;flex-direction:column;gap:8px}
.pick button{background:#F6F9FF;color:var(--ink);border:2px solid var(--sky-line);display:flex;justify-content:space-between;font-weight:700}
.res{border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:8px;text-align:center;background:var(--white)}
.res.ok{border:4px solid var(--blue);box-shadow:0 10px 28px rgba(28,96,239,.18);background:linear-gradient(180deg,var(--white),var(--ok-soft))}
.res.no{background:var(--no-soft);border:3px solid var(--no)}
.badge{font-size:30px;font-weight:900}
.ok .badge{color:var(--blue)} .no .badge{color:var(--no)}
.cnt{font-size:56px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--blue-deep)}
.cnt small{font-size:20px;font-weight:900;color:var(--ink)}
.clock,.rec{font-size:15px;color:var(--gray);font-variant-numeric:tabular-nums}
.msg{font-size:16px;margin:0}
.ghost{background:transparent;color:var(--blue);border:2px solid var(--blue);font-size:16px;padding:10px}
.walk-link{background:transparent;color:var(--blue-deep);font-size:15px;padding:6px;text-decoration:underline;text-underline-offset:4px}
.walk-tag{align-self:center;font-size:13px;font-weight:900;color:var(--white);background:var(--blue-deep);padding:3px 12px;border-radius:999px}
.err{color:var(--no);font-size:14px;margin:0;text-align:center}
.foot{font-size:12px;color:var(--gray);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="band"><span class="mark"><i></i></span><b>광양제철고등학교</b><span>GWANGYANG JECHEOL HS</span></div>
  <div class="head">
    <span class="pill">2027학년도 5차 입학설명회</span>
    <h1><em>입장</em> 확인</h1>
    <p class="sub">신청한 학생 이름을 입력하고, 확인 화면을 입구에서 보여 주세요.</p>
  </div>

  <!-- 1단계: 이름 -->
  <form id="f" class="box" autocomplete="off">
    <label for="nm">학생 이름</label>
    <input id="nm" type="text" placeholder="예: 홍길동" maxlength="20" required>
    <button type="submit">신청 확인</button>
    <p class="hint">네이버폼 신청 때 적은 학생 이름 그대로 입력하세요.</p>
    <button type="button" class="walk-link" data-walk>신청하지 않았나요? 현장 등록하기</button>
  </form>

  <!-- 동명이인: 지역 선택 -->
  <div id="s-pick" class="box" hidden>
    <div class="who" id="pk-who"></div>
    <p class="msg">같은 이름의 신청자가 여러 명입니다. 지역과 출신 중학교를 확인해 골라 주세요.</p>
    <div class="pick" id="pk"></div>
    <button type="button" class="ghost" data-back>처음으로</button>
  </div>

  <!-- 2단계: 참석 인원 -->
  <div id="s-cnt" class="box" hidden>
    <div class="who" id="c-who"></div>
    <div class="reg" id="c-reg"></div>
    <label style="text-align:center">오늘 함께 오신 인원 (학생 포함)</label>
    <div class="step">
      <button type="button" id="dn" aria-label="한 명 줄이기">−</button>
      <output id="cv">1</output><span class="unit">명</span>
      <button type="button" id="up" aria-label="한 명 늘리기">+</button>
    </div>
    <button type="button" id="go">입장 확인</button>
    <button type="button" class="ghost" data-back>처음으로</button>
  </div>

  <!-- 현장 등록(미신청자) -->
  <form id="s-walk" class="box" autocomplete="off" hidden>
    <span class="walk-tag">현장 등록</span>
    <label for="w-nm">학생 이름</label>
    <input id="w-nm" type="text" maxlength="20" required>
    <label for="w-rg">사는 지역</label>
    <input id="w-rg" type="text" maxlength="10" placeholder="예: 여수, 순천, 창원" required>
    <label for="w-sc">출신 중학교</label>
    <input id="w-sc" type="text" maxlength="30" placeholder="예: 광양중학교" required>
    <label style="text-align:center">오늘 함께 오신 인원 (학생 포함)</label>
    <div class="step">
      <button type="button" id="w-dn" aria-label="한 명 줄이기">−</button>
      <output id="w-cv">2</output><span class="unit">명</span>
      <button type="button" id="w-up" aria-label="한 명 늘리기">+</button>
    </div>
    <p class="err" id="w-err" hidden></p>
    <button type="submit" id="w-go">현장 등록하고 입장</button>
    <button type="button" class="ghost" data-back>처음으로</button>
  </form>

  <!-- 3단계: 결과 -->
  <div id="out" hidden></div>
  <p class="foot">이 화면에는 신청 여부와 인원만 표시됩니다.</p>
</div>

      out.innerHTML='<div class="res no"><div class="badge">명단에 없습니다</div><div class="who">'+esc(name)+'</div>'+
        '<p class="msg">이름을 다시 확인해 입력해 주세요. 신청하지 않았다면 현장 등록을 해 주세요.</p>'+
        '<button type="button" id="wk">현장 등록하기</button>'+
        '<button type="button" class="ghost" id="ag">이름 다시 입력</button></div>';
      show(out); $('ag').onclick=reset; $('wk').onclick=function(){walk(name)}; return;
    }
    if(hit.length===1) return ask(hit[0]);
    $('pk-who').textContent=name+' 학생'; var pk=$('pk'); pk.innerHTML='';
    hit.forEach(function(h){var b=document.createElement('button');b.type='button';
      b.innerHTML='<span>'+esc(h[1]+(h[3]?' · '+h[3]:''))+'</span><span>신청 '+h[0]+'명</span>';b.onclick=function(){ask(h)};pk.appendChild(b)});
    show($('s-pick'));
  });
  function tick(){var c=$('clk'); if(c) c.textContent='확인 시각 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
  $('go').onclick=function(){
    out.innerHTML='<div class="res ok"><div class="badge">✓ 신청자 확인</div><div class="who">'+esc(name)+' 학생</div>'+
      '<div class="cnt">'+n+'<small> 명 입장</small></div><div class="msg">신청 '+cur[0]+'명</div>'+
      '<div class="clock" id="clk"></div><div class="rec" id="rec">입장 기록 중…</div>'+
      '<button type="button" class="ghost" id="ag">다른 이름 확인</button></div>';
    show(out); $('ag').onclick=reset; clearInterval(timer); tick(); timer=setInterval(tick,1000);
    var u=API+'?a=in&id='+encodeURIComponent(cur[2])+'&n='+n+'&r='+encodeURIComponent(cur[1])+'&p='+cur[0];
    fetch(u).then(function(r){return r.json()}).then(function(j){
      $('rec').textContent = j.ok ? (j.dup?'이미 입장 기록이 있어 인원만 고쳤습니다':'입장 기록 완료') : '기록 실패 (입장은 가능합니다)';
    }).catch(function(){var r=$('rec'); if(r) r.textContent='기록 실패 (입장은 가능합니다)'});
  };
  // 현장 등록
  var wn=2;
  function setW(v){wn=Math.max(1,Math.min(10,v));$('w-cv').textContent=wn}
  $('w-dn').onclick=function(){setW(wn-1)}; $('w-up').onclick=function(){setW(wn+1)};
  function walk(pre){
    $('w-nm').value=pre||norm(nm.value)||''; $('w-rg').value=''; $('w-sc').value=''; setW(2);
    $('w-err').hidden=true; $('w-go').disabled=false; show($('s-walk')); ($('w-nm').value?$('w-rg'):$('w-nm')).focus();
  }
  document.querySelectorAll('[data-walk]').forEach(function(b){b.onclick=function(){walk('')}});
  $('s-walk').addEventListener('submit', function(e){
    e.preventDefault();
    var wname=norm($('w-nm').value), rg=$('w-rg').value.trim(), sc=$('w-sc').value.trim();
    if(!wname||!rg||!sc) return;
    var go=$('w-go'); go.disabled=true; go.textContent='등록 중…';
    fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({name:wname,region:rg,school:sc,n:wn})})
      .then(function(r){return r.json()}).then(function(j){
        go.disabled=false; go.textContent='현장 등록하고 입장';
        if(!j.ok) throw 0;
        out.innerHTML='<div class="res ok"><span class="walk-tag">현장 등록</span><div class="badge">✓ 입장 확인</div><div class="who">'+esc(wname)+' 학생</div>'+
          '<div class="cnt">'+wn+'<small> 명 입장</small></div><div class="msg">'+esc(rg)+' · '+esc(sc)+'</div>'+
          '<div class="clock" id="clk"></div><div class="rec">현장 등록 기록 완료</div>'+
          '<button type="button" class="ghost" id="ag">처음으로</button></div>';
        show(out); $('ag').onclick=reset; clearInterval(timer); tick(); timer=setInterval(tick,1000);
      }).catch(function(){
        go.disabled=false; go.textContent='현장 등록하고 입장';
        var er=$('w-err'); er.textContent='등록하지 못했습니다. 다시 눌러 주시거나 입구 안내 데스크에 말씀해 주세요.'; er.hidden=false;
      });
  });
})();
</script>
</body>
</html>
